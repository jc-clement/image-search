<html>
<head>
<title>Image Search</title>
<style>
.grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
	gap: 4px;
}
.grid-item {
	aspect-ratio: 1;
	background: #7C7C7C;
	position: relative;
}
.grid-item .date {
	position: absolute;
	bottom: 0;
	width: 100%;
	text-align: center;
	font-family: sans-serif;
	font-size: 1em;
	color: white;
	background: rgba(0,0,0,0.3);
	padding: 2px 0;
}
.grid-item img {
	width: 100%;
	height: 100%;
	object-fit: contain;
	image-orientation: from-image;
}
#lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#lightbox-content {
    max-width: 90vw;
    max-height: 95vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#lightbox-img {
    max-width: 95vw;
    max-height: 80vh;
    object-fit: contain;
    image-orientation: from-image;
}

#lightbox-meta {
    color: white;
    font-family: sans-serif;
    font-size: 0.9em;
    text-align: center;
    padding: 8px;
}
</style>
</head>
<body>
<div class="grid">
{% for image in images %}
<div class="grid-item"
	data-display="{{ image.display }}"
	data-timestamp="{{ image.timestamp or '' }}"
	data-lat="{{ image.lat or '' }}"
	data-lng="{{ image.lng or '' }}"
	data-tags="{{ image.tags | join(',') if image.tags else '' }}">
	<img src="{{ image.thumb }}"></img>
	<div class="date">{{ image.timestamp.strftime('%Y-%m-%d') if image.timestamp else '' }}</div>
</div>
{% endfor %}
</div>
<div id="lightbox" style="display:none;">
	<div id="lightbox-content">
		<img id="lightbox-img" src="">
		<div id="lightbox-meta">
			<span id="lightbox-date"></span><br/>
			<span id="lightbox-location"></span>
		</div>
	</div>
</div>
<script>
document.querySelectorAll('.grid-item').forEach(item => {
    item.addEventListener('click', function() {
        const display = this.dataset.display;
        const timestamp = this.dataset.timestamp;
        const lat = this.dataset.lat;
        const lng = this.dataset.lng;
        const tags = this.dataset.tags;

        document.getElementById('lightbox-img').src = display;
        document.getElementById('lightbox-date').textContent = timestamp;
        document.getElementById('lightbox-location').textContent = lat && lng ? lat + ', ' + lng : '';

        document.getElementById('lightbox').style.display = 'flex';
    });
});

document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) {
        this.style.display = 'none';
    }
});
</script>
</body>
</html>
