<html>
<head>
<title>Image Search</title>
<style>
.grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
	gap: 4px;
}
.grid-item {
	aspect-ratio: 1;
	background: #7C7C7C;
	position: relative;
}
.grid-item .date {
	position: absolute;
	bottom: 0;
	width: 100%;
	text-align: center;
	font-family: sans-serif;
	font-size: 1em;
	color: white;
	background: rgba(0,0,0,0.3);
	padding: 2px 0;
}
.grid-item img {
	width: 100%;
	height: 100%;
	object-fit: contain;
	image-orientation: from-image;
}
</style>
</head>
<body>
<div class="grid">
{% for image in images %}
<div class="grid-item">
	<img src="{{ image.thumb }}"></img>
	<div class="date">{{ image.timestamp.strftime('%Y-%m-%d') if image.timestamp else '' }}</div>
</div>
{% endfor %}
</div>
</body>
</html>
