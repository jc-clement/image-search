services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: image_search
      POSTGRES_USER: image_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

  app:
    build: ./app

volumes:
  data_postgres:
