services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: image_search
      POSTGRES_USER: image_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7

  nginx:
    image: nginx:alpine

  app:
    build: ./app
